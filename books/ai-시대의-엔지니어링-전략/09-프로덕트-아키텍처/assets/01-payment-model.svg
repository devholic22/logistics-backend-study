<svg xmlns="http://www.w3.org/2000/svg" data-theme="light" viewBox="0 0 1120 650" role="img" lang="ko" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="showcase">
<style>svg{background:#f8fafc;}
svg{
      width: 100%;
      min-width: min(900px, 100%);
      display: block;
      transform-origin: 0 0;
      transition: transform 0.18s ease;
    }
.c-grid{ stroke: #e2e8f0; fill: none; }
.c-mask{ fill: #ffffff; stroke: none; }
.c-database{ fill: rgba(167, 139, 250, 0.2);   stroke: #7c3aed; }
.c-external{ fill: rgba(148, 163, 184, 0.18);   stroke: #64748b; }
.t-primary{ fill: #0f172a; }
.t-muted{ fill: #64748b; }
.a-default{ stroke: #94a3b8; fill: none; }
.m-default{ fill: #94a3b8; }
.m-emphasis{ fill: #059669; }
.m-security{ fill: #e11d48; }
.m-dashed{ fill: #7c3aed; }
text{font-family: "Noto Sans CJK KR", sans-serif;}
</style>
        <title id="archify-diagram-title">결제 데이터 모델의 일대다 관계</title>
        <desc id="archify-diagram-description">Archify로 생성한 본문의 관계 도식입니다.</desc>
        <!-- Definitions -->
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-default" />
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-emphasis" />
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-security" />
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" class="m-dashed" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" class="c-grid" stroke-width="0.5"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Boundaries (behind everything) -->


        <!-- Connection paths (before components for correct z-order) -->
        <path data-edge-from="customer" data-edge-to="payment" data-edge-label="1 : 다" data-edge-key="0" data-composition-points="300,166;820,166" d="M 300 166 L 820 166" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <path data-edge-from="merchant" data-edge-to="payment" data-edge-label="1 : 다" data-edge-key="1" data-composition-points="300,496;560,496;560,180;820,180" d="M 300 496 L 552 496 Q 560 496 560 488 L 560 188 Q 560 180 568 180 L 820 180" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <path data-edge-from="merchant" data-edge-to="balance" data-edge-label="1 : 다" data-edge-key="2" data-composition-points="300,510;820,510" d="M 300 510 L 820 510" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>

        <!-- Components -->
        <g id="node-customer" data-node-id="customer" data-node-label="고객" tabindex="0" role="button" aria-label="Focus 고객, 결제를 수행하는 주체, Architecture component" aria-pressed="false" data-node-kind="external" data-node-sublabel="결제를 수행하는 주체" data-node-context="Architecture component">
          <title>고객 · 결제를 수행하는 주체 · Architecture component</title>
          <rect x="60" y="130" width="240" height="86" rx="6" class="c-mask"/>
