          <g aria-hidden="true" data-semantic-sigil="database" class="semantic-sigil s-database" transform="translate(826 466) scale(0.6875)">
            <ellipse cx="8" cy="4" rx="5" ry="2"/>
            <path d="M3 4v8c0 1.1 2.2 2 5 2s5-.9 5-2V4M3 8c0 1.1 2.2 2 5 2s5-.9 5-2"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="940" y="501" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">잔액</text>
        <text data-detail="context" x="940" y="517" class="t-muted" font-size="9" text-anchor="middle">관계의 다 쪽</text>
        </g>

        <!-- Connection labels -->
        <g data-detail="context" data-edge-from="customer" data-edge-to="payment" data-edge-label="1 : 다" data-edge-key="0">
          <rect x="540.6" y="146" width="38.8" height="14" rx="3" class="c-mask"/>
          <text x="560" y="156" class="t-muted" font-size="8" text-anchor="middle">1 : 다</text>
        </g>
        <g data-detail="context" data-edge-from="merchant" data-edge-to="payment" data-edge-label="1 : 다" data-edge-key="1">
          <rect x="540.6" y="318" width="38.8" height="14" rx="3" class="c-mask"/>
          <text x="560" y="328" class="t-muted" font-size="8" text-anchor="middle">1 : 다</text>
        </g>
        <g data-detail="context" data-edge-from="merchant" data-edge-to="balance" data-edge-label="1 : 다" data-edge-key="2">
          <rect x="650.6" y="490" width="38.8" height="14" rx="3" class="c-mask"/>
          <text x="670" y="500" class="t-muted" font-size="8" text-anchor="middle">1 : 다</text>
        </g>

        <!-- Boundary labels (foreground masks keep routes out of titles) -->


        <!-- Legend -->
        <g data-legend="" data-legend-bridge="">
          <text x="40" y="614" class="t-primary" font-size="12" font-weight="650">Legend</text>
          <g data-legend-semantic-kind="database" data-legend-kind="database" data-legend-label="데이터·지표" data-legend-x="40" data-legend-baseline="634" data-legend-width="98">
            <rect x="40" y="625" width="16" height="10" rx="2.5" class="c-database" stroke-width="1"/>
            <text x="62" y="634" class="t-muted" font-size="10" font-weight="500">데이터·지표</text>
          </g>
          <g data-legend-semantic-kind="external" data-legend-kind="external" data-legend-label="사용자·시나리오" data-legend-x="160" data-legend-baseline="634" data-legend-width="118">
            <rect x="160" y="625" width="16" height="10" rx="2.5" class="c-external" stroke-width="1"/>
