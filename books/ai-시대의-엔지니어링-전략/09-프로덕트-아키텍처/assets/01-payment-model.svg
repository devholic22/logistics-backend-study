            <path d="M8 2.5h5.5V8M13.5 2.5 7.5 8.5"/>
          </g>
          <text data-node-label="" data-detail-anchor="" x="180" y="171" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">고객</text>
        <text data-detail="context" x="180" y="187" class="t-muted" font-size="9" text-anchor="middle">결제를 수행하는 주체</text>
        </g>

