<svg xmlns="http://www.w3.org/2000/svg" width="540" height="650" viewBox="0 0 540 650" role="img" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',Pretendard,'Malgun Gothic',system-ui,sans-serif"><title>ERP의 확장 과정 — MRP에서 Extended ERP까지</title><defs><marker id="a6b7f3a" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0.6 L7.6,4 L0,7.4 z" fill="#6b7f3a"/></marker><marker id="a8a6a1c" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0.6 L7.6,4 L0,7.4 z" fill="#8a6a1c"/></marker><marker id="a2b4fa8" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0.6 L7.6,4 L0,7.4 z" fill="#2b4fa8"/></marker></defs><rect x="0.5" y="0.5" width="539" height="649" rx="10" ry="10" fill="#fbfbf9" stroke="#e4e7e0"/><text x="270.0" y="40.0" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">ERP의 확장 과정</text><text x="270.0" y="62.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">각 단계는 앞 단계에서 드러난 “부족한 자원”을 끌어안는다</text><rect x="110.0" y="92.0" width="320.0" height="83.0" rx="12" ry="12" fill="#ffffff" stroke="#6b7f3a" stroke-width="2"/><rect x="120.0" y="102.0" width="300.0" height="32.0" rx="8" ry="8" fill="#6b7f3a"/><text x="270.0" y="124.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">MRP</text><text x="270.0" y="158.0" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="middle">원부자재 소요 계획</text><path d="M270.0,179.0 L270.0,235.0" fill="none" stroke="#6b7f3a" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a6b7f3a)"/><rect x="206.1" y="198.0" width="127.8" height="24.0" rx="12.0" ry="12.0" fill="#ffffff" stroke="#6b7f3a" stroke-width="1.4"/><text x="270.0" y="214.5" font-size="12.5" font-weight="700" fill="#6b7f3a" text-anchor="middle">설비 · 인력이 부족</text><rect x="110.0" y="241.0" width="320.0" height="83.0" rx="12" ry="12" fill="#ffffff" stroke="#8a6a1c" stroke-width="2"/><rect x="120.0" y="251.0" width="300.0" height="32.0" rx="8" ry="8" fill="#8a6a1c"/><text x="270.0" y="273.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">MRP II</text><text x="270.0" y="307.0" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="middle">+ 인력 · 설비 능력</text><path d="M270.0,328.0 L270.0,384.0" fill="none" stroke="#8a6a1c" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a8a6a1c)"/><rect x="211.5" y="347.0" width="117.0" height="24.0" rx="12.0" ry="12.0" fill="#ffffff" stroke="#8a6a1c" stroke-width="1.4"/><text x="270.0" y="363.5" font-size="12.5" font-weight="700" fill="#8a6a1c" text-anchor="middle">돈과 영업이 필요</text><rect x="110.0" y="390.0" width="320.0" height="83.0" rx="12" ry="12" fill="#ffffff" stroke="#2b4fa8" stroke-width="2"/><rect x="120.0" y="400.0" width="300.0" height="32.0" rx="8" ry="8" fill="#2b4fa8"/><text x="270.0" y="422.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">ERP</text><text x="270.0" y="456.0" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="middle">+ 재무 · 영업 등 전사</text><path d="M270.0,477.0 L270.0,533.0" fill="none" stroke="#2b4fa8" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#a2b4fa8)"/><rect x="199.9" y="496.0" width="140.2" height="24.0" rx="12.0" ry="12.0" fill="#ffffff" stroke="#2b4fa8" stroke-width="1.4"/><text x="270.0" y="512.5" font-size="12.5" font-weight="700" fill="#2b4fa8" text-anchor="middle">고객 · 협력사로 확장</text><rect x="110.0" y="539.0" width="320.0" height="83.0" rx="12" ry="12" fill="#ffffff" stroke="#6b3fa0" stroke-width="2"/><rect x="120.0" y="549.0" width="300.0" height="32.0" rx="8" ry="8" fill="#6b3fa0"/><text x="270.0" y="571.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Extended ERP</text><text x="270.0" y="605.0" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="middle">+ 고객 · 협력사 관리</text></svg>