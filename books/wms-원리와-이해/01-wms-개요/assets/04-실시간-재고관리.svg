<svg xmlns="http://www.w3.org/2000/svg" width="680" height="832" viewBox="0 0 680 832" role="img" font-family="-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',Pretendard,'Malgun Gothic',system-ui,sans-serif"><title>WMS 실시간 재고관리 — 작업 결과 입력에서 실시간 공유까지</title><defs><marker id="a6b7280" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0.6 L7.6,4 L0,7.4 z" fill="#6b7280"/></marker></defs><rect x="0.5" y="0.5" width="679" height="831" rx="10" ry="10" fill="#fbfbf9" stroke="#e4e7e0"/><text x="340.0" y="40.0" font-size="19" font-weight="700" fill="#1f2937" text-anchor="middle">실시간 재고관리가 도는 방식</text><text x="340.0" y="62.0" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">작업 결과가 장비를 거쳐 즉시 WMS에 반영되고, 관리자와 타 시스템으로 공유된다</text><rect x="110.0" y="106.0" width="460.0" height="290.0" rx="16" ry="16" fill="none" stroke="#a9b0a4" stroke-width="1.6" stroke-dasharray="7 6"/><rect x="302.1" y="93.0" width="75.8" height="26.0" rx="13" ry="13" fill="#fbfbf9" stroke="#6b7280" stroke-width="1.4"/><text x="340.0" y="110.5" font-size="12.5" font-weight="700" fill="#6b7280" text-anchor="middle">창고 현장</text><rect x="210.0" y="138.0" width="260.0" height="83.0" rx="12" ry="12" fill="#ffffff" stroke="#8a6a1c" stroke-width="2"/><rect x="220.0" y="148.0" width="240.0" height="32.0" rx="8" ry="8" fill="#8a6a1c"/><text x="340.0" y="170.0" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">작업자</text><text x="340.0" y="204.0" font-size="13.5" font-weight="400" fill="#4b5563" text-anchor="middle">작업 수행</text><rect x="150.0" y="281.0" width="380.0" height="83.0" rx="12" ry="12" fill="#ffffff" stroke="#8a6a1c" stroke-width="2"/><rect x="160.0" y="291.0" width="360.0" height="32.0" rx="8" ry="8" fill="#8a6a1c"/><text x="340.0" y="313.0" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">바코드 · 모바일 장비</text><text x="340.0" y="347.0" font-size="13.5" font-weight="400" fill="#4b5563" text-anch